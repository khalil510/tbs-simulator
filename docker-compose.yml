# Local development stack. Production orchestration (K8s + Agones) lives in
# infra/k8s once milestone M4 lands.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tbs
      POSTGRES_USER: tbs
      POSTGRES_PASSWORD: tbs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbs -d tbs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tbs
      MINIO_ROOT_PASSWORD: tbs-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: dev-only-change-me
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./schemas:/schemas:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./schemas:/schemas:ro
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    environment:
      # Angular dev server proxies /api to the backend container.
      API_PROXY_TARGET: http://backend:8000
    command: npm start -- --host 0.0.0.0 --port 4200
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
