name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests (sqlite fallback GIS backend)
        working-directory: backend
        env:
          TBS_DB_ENGINE: sqlite
          TBS_BUNDLED_GIS: "1"
        run: python -m pytest -q

  backend-postgis:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: tbs
          POSTGRES_USER: tbs
          POSTGRES_PASSWORD: tbs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tbs -d tbs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system GIS libraries
        run: sudo apt-get update && sudo apt-get install -y libgeos-c1v5 libgdal34 libproj25
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Migrations + tests against real PostGIS
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: tbs
          POSTGRES_PASSWORD: tbs
          POSTGRES_DB: tbs
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate schema documents
        run: |
          node -e "JSON.parse(require('fs').readFileSync('schemas/scenario.schema.json'))"
          node -e "JSON.parse(require('fs').readFileSync('schemas/aar-event.schema.json'))"
          echo "schemas parse OK"
