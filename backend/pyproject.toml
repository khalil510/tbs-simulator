[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",    # line length handled by formatter preference, not a hard error
    "B008",    # DRF .as_view() in defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
